
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wishlist ♡</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header class="cabecalho">
        <h1>My Wishlist <span>♡</span></h1>
        <p>Pequenos desejos, grandes planos.</p>
    </header>

    <main class="container">

        <section class="resumo">
            <div class="cartao-resumo">
                <span>♡</span>
                <p>Meus desejos</p>
                <strong id="total-itens">0</strong>
            </div>

            <div class="cartao-resumo">
                <span>✿</span>
                <p>Já comprei</p>
                <strong id="total-comprados">0</strong>
            </div>

<section class="painel-orcamento" id="painel-orcamento" hidden>
    <form id="formulario-orcamento">
        <label for="valor-orcamento">Quanto você pretende gastar?</label>
        <input
            type="number"
            id="valor-orcamento"
            min="0"
            step="0.01"
            placeholder="Ex.: 300,00"
            required
        >

        <div class="botoes-formulario">
            <button type="button" id="cancelar-orcamento">Cancelar</button>
            <button type="submit">Salvar orçamento ♡</button>
        </div>
    </form>

    <div class="progresso-orcamento">
        <div class="barra-progresso">
            <div id="barra-orcamento"></div>
        </div>
        <p id="resumo-orcamento">Defina seu orçamento para começar ♡</p>
    </div>
</section>

<button class="cartao-resumo cartao-orcamento" id="botao-orcamento" type="button">
    <span>₊˚</span>
    <p>Meu orçamento</p>
    <strong id="orcamento">R$ 0,00</strong>
    <small>Toque para editar ♡</small>
</button>

        </section>

        <section class="lista-produtos">
            <div class="titulo-secao">
                <div>
                    <h2>Minha wishlist ♡</h2>
                    <p>Coisinhas que quero conquistar.</p>
                </div>

                <button id="botao-adicionar" type="button">
                    + Adicionar
                </button>
            </div>

            <div id="formulario-container" hidden>
                <form id="formulario-produto">
                    <label for="nome-produto">Nome do produto</label>
                    <input
                        type="text"
                        id="nome-produto"
                        placeholder="Ex.: Bolsa preta"
                        required
                    >

                    <label for="preco-produto">Preço (R$)</label>
                    <input
                        type="number"
                        id="preco-produto"
                        placeholder="Ex.: 129,90"
                        min="0"
                        step="0.01"
                        required
                    >

                    <label for="categoria-produto">Categoria</label>
                    <select id="categoria-produto" required>
                        <option value="Roupas">Roupas</option>
                        <option value="Bolsas">Bolsas</option>
                        <option value="Calçados">Calçados</option>
                        <option value="Acessórios">Acessórios</option>
                        <option value="Beleza">Beleza</option>
                        <option value="Outros">Outros</option>
                    </select>

                    <label for="imagem-produto">Link da imagem (opcional)</label>
                    <input
                        type="url"
                        id="imagem-produto"
                        placeholder="https://..."
                    >

                    <label for="link-produto">Link da loja (opcional)</label>
                    <input
                        type="url"
                        id="link-produto"
                        placeholder="https://..."
                    >

                    <div class="botoes-formulario">
                        <button type="button" id="botao-cancelar">
                            Cancelar
                        </button>
                        <button type="submit">
                            Salvar ♡
                        </button>
                    </div>
                </form>
            </div>

            <div id="lista-produtos-container" class="grade-produtos">
                <p id="mensagem-vazia">
                    Sua wishlist está esperando por você. ♡
                </p>
            </div>
        </section>

    </main>

    <footer class="rodape">
        <p>Feito com carinho, para todos os seus pequenos desejos ♡</p>
    </footer>

</body>
</html>
